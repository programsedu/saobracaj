<!DOCTYPE html>
<html lang="sr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Saobraćajni dijagrami</title>
<style>
:root{--bg:#f4f0ea;--ink:#1f2a30;--muted:#5b6770;--teal:#0f5c63;--line:#e2ddd5;--card:#fff}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif}
body{display:flex;flex-direction:column;min-height:100vh}
header,footer{background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:14px;padding:8px 14px;flex-wrap:wrap}
header{flex-wrap:nowrap;gap:10px;overflow-x:auto}
header>*{flex:none}
header .actions{margin-left:auto;display:flex;gap:8px}
header .brand{margin-right:4px !important}
#preset{max-width:250px;text-overflow:ellipsis}
#prioDir{max-width:160px;text-overflow:ellipsis}
.seg button{padding:5px 10px}
header .ib{width:30px;height:32px}
@media (max-width:1750px){ header .lbl{display:none} }
@media (max-width:1600px){ header .brand span{display:none} }
@media (max-width:1250px){ header{gap:7px;padding:8px 10px} .seg button{padding:5px 8px;font-size:11px} header select{font-size:11px;padding:5px 6px} #preset{max-width:150px} #prioDir{max-width:120px} header .actions .btn{padding:7px 9px;font-size:11px} header .ib{width:28px} }
footer{border-top:1px solid var(--line);border-bottom:none;flex-wrap:nowrap;gap:12px;overflow-x:auto}
footer .grp{flex:none}
footer .sepv{width:1px;height:24px;background:var(--line);flex:none}
.brand{display:flex;align-items:center;gap:8px;font-weight:700;font-size:17px;margin-right:auto;white-space:nowrap}
.lbl{font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.grp{display:flex;align-items:center;gap:8px}
.seg{display:flex;border:1px solid var(--line);border-radius:999px;padding:2px}
.seg button{border:0;background:none;border-radius:999px;padding:5px 12px;font-weight:700;font-size:12px;color:var(--muted);cursor:pointer;text-transform:uppercase}
.seg button.on{background:var(--teal);color:#fff}
select{font:inherit;font-size:12px;font-weight:700;color:var(--teal);border:1px solid var(--line);border-radius:8px;padding:5px 8px;background:#fff;cursor:pointer;text-transform:uppercase}
select.lang{text-transform:none}
.icons{display:flex;gap:2px;align-items:center}
.ib{border:0;background:none;width:34px;height:34px;border-radius:8px;cursor:pointer;color:var(--muted);display:grid;place-items:center;position:relative}
.ib:hover:not(:disabled){background:#eef3f3;color:var(--teal)}
.ib:disabled{opacity:.35;cursor:default}
.ib svg{width:18px;height:18px}
.sep{width:1px;height:22px;background:var(--line);margin:0 4px}
main{flex:1;display:flex;align-items:center;justify-content:center;padding:8px;position:relative;overflow:hidden;min-height:0}
#stage{position:relative;width:min(100%,calc((100vh - 150px)*4/3));aspect-ratio:4/3}
#board{overflow:hidden}
.zoom{display:flex;align-items:center;gap:2px;border:1px solid var(--line);border-radius:8px;padding:1px}
.zoom button{border:0;background:none;width:28px;height:28px;font-size:17px;font-weight:700;color:var(--teal);cursor:pointer;border-radius:6px}
.zoom button:hover{background:#eef3f3}
.zoom span{min-width:44px;text-align:center;font-size:12px;font-weight:700;color:var(--muted)}
#board{width:100%;height:100%;display:block;border-radius:10px;box-shadow:0 1px 3px rgba(0,0,0,.08);touch-action:none;user-select:none}
#board [data-id],#board [data-slot]{cursor:pointer}
.palette{display:flex;gap:6px;align-items:center;touch-action:none}
.part{width:46px;height:30px;border:0;background:none;border-radius:8px;cursor:grab;display:grid;place-items:center}
.part:hover{background:#eef3f3}
.part svg{width:44px;height:26px;pointer-events:none}
.hint{color:var(--muted);font-size:13px;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.help{width:30px;height:30px;border-radius:50%;border:1px solid var(--line);background:#fff;font-weight:700;color:var(--muted);cursor:pointer}
.pop{max-height:calc(100% - 8px);overflow:auto;max-width:310px;position:absolute;z-index:20;background:#fff;border-radius:12px;box-shadow:0 8px 28px rgba(0,0,0,.18);padding:12px;min-width:220px;font-size:12px}
.pop h4{margin:0 0 6px;font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.pop .row{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px}
.btn{border:1px solid var(--line);background:#fff;border-radius:8px;padding:6px 9px;font-weight:700;font-size:11px;cursor:pointer;color:var(--ink);text-transform:uppercase}
.btn.on{background:var(--teal);color:#fff;border-color:var(--teal)}
.btn.ic{width:34px;height:34px;padding:0;display:grid;place-items:center}
.btn.ic svg{width:18px;height:18px}
.sw{width:24px;height:24px;border-radius:50%;border:2px solid #fff;box-shadow:0 0 0 1px #ccc;cursor:pointer}
.sw.on{box-shadow:0 0 0 2px var(--teal)}
.pop .foot{display:flex;justify-content:space-between;align-items:center;border-top:1px solid var(--line);padding-top:10px;gap:10px}
.del{border:0;background:none;color:#c0392b;font-weight:700;font-size:11px;cursor:pointer;text-transform:uppercase}
.signs{display:flex;gap:6px;flex-wrap:wrap}
.signs .btn{display:flex;flex-direction:column;align-items:center;gap:4px;width:88px;padding:7px 4px;font-size:10px;line-height:1.15;text-align:center}
.signs svg{width:28px;height:30px}
.xgrid{display:grid;grid-template-columns:repeat(7,34px);gap:5px;margin-bottom:6px}
.xgrid .btn{width:34px;height:34px;padding:0;display:grid;place-items:center}
.xgrid .btn.on{background:#d9ecec;border-color:var(--teal);box-shadow:0 0 0 1px var(--teal)}
.xgrid svg{width:27px;height:27px}
.xnames{font-size:11px;color:var(--muted);margin-bottom:4px;min-height:14px}
.panelbtn{display:flex;align-items:center;gap:8px;text-align:left;text-transform:none;width:100%;margin-bottom:10px}
.panelbtn svg{width:30px;height:24px;flex:none}
.menu{position:absolute;z-index:30;background:#fff;border-radius:10px;box-shadow:0 8px 28px rgba(0,0,0,.18);padding:6px;top:40px;right:0;min-width:120px}
.menu button{display:block;width:100%;text-align:left;border:0;background:none;padding:8px 10px;border-radius:6px;font-weight:600;cursor:pointer}
.menu button:hover{background:#eef3f3}
.ghost{position:fixed;pointer-events:none;z-index:50;width:60px;height:80px;margin:-40px 0 0 -30px;opacity:.85}
.toast{position:fixed;left:50%;bottom:80px;transform:translateX(-50%);background:#1f2a30;color:#fff;padding:9px 16px;border-radius:999px;font-size:13px;z-index:60;opacity:0;transition:opacity .2s;pointer-events:none}
.toast.show{opacity:1}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.35);display:none;align-items:center;justify-content:center;z-index:70;padding:16px}
.modal.show{display:flex}
.modal .box{background:#fff;border-radius:14px;max-width:520px;padding:20px 22px;line-height:1.5;font-size:14px}
.modal .box h3{margin:0 0 8px}
.modal input{width:100%;font:inherit;font-size:12px;padding:8px;border:1px solid var(--line);border-radius:8px;margin:8px 0}
.solbtn{background:var(--teal);color:#fff;border-color:var(--teal);padding:8px 12px;font-size:12px}
.solbtn.on{background:#fff;color:var(--teal)}
.sol{position:absolute;top:14px;right:14px;bottom:14px;width:min(380px,calc(100% - 28px));background:#fff;border-radius:14px;box-shadow:0 8px 28px rgba(0,0,0,.18);overflow:auto;padding:14px 16px;z-index:25;font-size:13px;line-height:1.45}
.sol .head{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px}
.sol .head b{font-size:15px}
.sol .reg{background:#eef6f6;border-radius:10px;padding:8px 10px;margin:6px 0 12px;color:#21474b}
.sol .step{display:flex;gap:10px;margin-bottom:12px}
.sol .num{flex:none;width:26px;height:26px;border-radius:7px;background:var(--teal);color:#fff;font-weight:700;display:grid;place-items:center}
.sol .ent{margin-bottom:6px}
.sol .ent .who{font-weight:700}
.sol .ent ul{margin:3px 0 0;padding-left:18px;color:#36454d}
.sol .tog{font-size:11px;color:var(--muted);font-weight:700;text-transform:uppercase;letter-spacing:.05em}
.sol h5{margin:14px 0 6px;font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.sol .disc{font-size:11px;color:var(--muted);border-top:1px solid var(--line);padding-top:8px;margin-top:12px}
.sol .warn{color:#b04a00}
.propbtn{background:#fff;color:#b35900;border:1px solid #e0a060;padding:8px 12px;font-size:12px}
.propbtn.on{background:#b35900;color:#fff;border-color:#b35900}
.sol .chips{display:flex;flex-direction:column;gap:6px;margin:8px 0}
.sol .chiprow{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.sol .chip{background:#fbe9d7;border:1px solid #e0a060;border-radius:999px;padding:2px 9px;font-weight:700;cursor:pointer}
.sol .chip:hover{background:#f6d2ad}
.sol .num.o{background:#b35900}
.sol .acts{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0}
.sol label.same{display:flex;gap:6px;align-items:center;font-size:12px;margin:6px 0;cursor:pointer}
.sol .res{border-radius:10px;padding:9px 11px;margin-top:10px}
.sol .res.good{background:#e6f4ea;color:#185c2c}
.sol .res.badr{background:#fdecea;color:#8a2318}
.sol .res ul{margin:6px 0 0;padding-left:18px}
@media (max-width:700px){.hint{display:none}.brand span{display:none}}
</style>
</head>
<body>
<header>
  <div class="brand">
    <svg width="28" height="28" viewBox="0 0 28 28"><rect x="2" y="2" width="24" height="24" rx="6" fill="#8bc34a"/><rect x="11" y="2" width="6" height="24" fill="#5f6168"/><rect x="2" y="11" width="24" height="6" fill="#5f6168"/><rect x="14.5" y="18" width="2" height="5" rx="1" fill="#2f7fdc"/></svg>
    <span data-t="title"></span>
  </div>
  <div class="grp"><span class="lbl" data-t="layout"></span>
    <div class="seg" id="layoutSeg"><button data-v="4" data-t="fourway"></button><button data-v="t">T</button><button data-v="r" data-t="ringLayout"></button></div>
    <select id="rlanes" hidden><option value="2" data-t="lanes2"></option><option value="3" data-t="lanes3"></option></select>
  </div>
  <div class="grp"><span class="lbl" data-t="controls"></span>
    <select id="preset">
      <option value="allstop" data-t="allstop"></option>
      <option value="twostop" data-t="twostop"></option>
      <option value="signals" data-t="signals"></option>
      <option value="none" data-t="uncontrolled"></option>
      <option value="priority" data-t="prioPreset"></option>
      <option value="ring" data-t="ringPreset"></option>
      <option value="custom" data-t="custom" disabled></option>
    </select>
    <select id="prioDir" hidden></select>
  </div>
  <div class="icons">
    <button class="ib" id="undo" data-tt="undo"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 14L4 9l5-5"/><path d="M4 9h11a5 5 0 0 1 0 10h-3"/></svg></button>
    <button class="ib" id="redo" data-tt="redo"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 14l5-5-5-5"/><path d="M20 9H9a5 5 0 0 0 0 10h3"/></svg></button>
    <div class="sep"></div>
    <button class="ib" id="copy" data-tt="copy"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="8" y="8" width="13" height="13" rx="2"/><path d="M16 8V5a2 2 0 0 0-2-2H5a2 2 0 0 0-2 2v9a2 2 0 0 0 2 2h3"/></svg></button>
    <div style="position:relative">
      <button class="ib" id="dl" data-tt="download"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v12"/><path d="M7 10l5 5 5-5"/><path d="M4 21h16"/></svg></button>
      <div class="menu" id="dlMenu" hidden><button data-f="png">PNG</button><button data-f="svg">SVG</button></div>
    </div>
    <button class="ib" id="share" data-tt="share"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M10 13a5 5 0 0 0 7.5.5l3-3a5 5 0 0 0-7-7l-1.7 1.7"/><path d="M14 11a5 5 0 0 0-7.5-.5l-3 3a5 5 0 0 0 7 7l1.7-1.7"/></svg></button>
    <div class="sep"></div>
    <button class="ib" id="clear" data-tt="clear"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18"/><path d="M8 6V4h8v2"/><path d="M6 6l1 15h10l1-15"/></svg></button>
    <div class="sep"></div>
    <select class="lang" id="lang">
      <option value="sr" title="Srpski">SR</option><option value="mk" title="Македонски">MK</option><option value="bg" title="Български">BG</option><option value="ro" title="Română">RO</option><option value="en" title="English">EN</option>
    </select>
  </div>
  <div class="actions"><button class="btn propbtn" id="propBtn" data-t="propose"></button><button class="btn solbtn" id="solBtn" data-t="solve"></button></div>
</header>
<main>
  <div id="stage"><svg id="board" viewBox="0 0 800 600" xmlns="http://www.w3.org/2000/svg"></svg></div>
  <div class="sol" id="propPanel" hidden><div class="head"><b data-t="propTitle"></b><button class="ib" id="propClose" aria-label="close">✕</button></div><div id="propBody"></div></div>
  <div class="sol" id="solPanel" hidden><div class="head"><b data-t="solTitle"></b><button class="ib" id="solClose" aria-label="close">✕</button></div><div id="solBody"></div></div>
</main>
<footer>
  <button class="help" id="helpBtn">?</button>
  <span class="lbl" data-t="parts"></span>
  <div class="palette" id="palette"></div>
  <div class="sepv"></div>
  <div class="grp"><span class="lbl" data-t="zoom"></span><div class="zoom"><button id="zoomOut" aria-label="−">−</button><span id="zoomVal"></span><button id="zoomIn" aria-label="+">+</button></div></div>
  <div class="grp"><span class="lbl" data-t="markings"></span>
    <select id="markings"><option value="eu" data-t="eu"></option><option value="us" data-t="us"></option></select>
  </div>
  <div class="grp"><span class="lbl" data-t="labels"></span>
    <select id="labels"><option value="none" data-t="none"></option><option value="num" data-t="numbers"></option><option value="let" data-t="letters"></option></select>
  </div>
  <span class="hint" id="hint" data-t="hint"></span>
</footer>
<div class="toast" id="toast"></div>
<div class="modal" id="helpModal"><div class="box"><h3 data-t="helpTitle"></h3><p data-t="helpText"></p><button class="btn on" data-close data-t="ok"></button></div></div>
<div class="modal" id="shareModal"><div class="box"><h3 data-t="share"></h3><p data-t="shareText"></p><input id="shareInput" readonly><button class="btn on" id="shareCopy" data-t="copyLink"></button> <button class="btn" data-close data-t="ok"></button></div></div>

function presetCtl(p){
  const o={}; const A=['s','w','n','e'];
  for(const a of A) o[a]={t:'none',c:'g',panel:false,x:((S.ctl[a]||{}).x||[]).slice()};
  if(p==='ring'){ A.forEach(a=>{ o[a].t='yield'; if(!o[a].x.includes('ii452')) o[a].x=EXTRAS.filter(k=>k==='ii452'||o[a].x.includes(k)); }); }
  if(p==='priority'){ const pr=S.prio||defaultPrio(), bend=!isStraightPair(pr); A.forEach(a=>{ o[a].t = pr.includes(a)?'prio':'yield'; o[a].panel=bend; }); }
  if(p==='allstop') A.forEach(a=>o[a].t='stop');
  if(p==='twostop'){ if(S.layout==='t') o.s.t='stop'; else { o.w.t='stop'; o.e.t='stop'; } }
  if(p==='signals'){ A.forEach(a=>o[a].t='light'); if(S.layout==='t'){ o.s.c='r'; o.w.c='g'; o.e.c='g'; } else { o.s.c='g'; o.n.c='g'; o.w.c='r'; o.e.c='r'; } }
  return o;
}
function detectPreset(){
  for(const p of (isRing()?['ring']:[]).concat(S.prio?['priority']:[]).concat(['allstop','twostop','signals','none'])){
    const o=presetCtl(p);
    if(arms().every(a=>o[a].t===S.ctl[a].t && (o[a].t!=='light' || o[a].c===S.ctl[a].c))) return p;
  }

}

const CTL_CODE={none:'0',stop:'s',yield:'y',prio:'p',prioEnd:'q'};
function encode(){
  let h='d'+(isRing()?(S.rlanes===3?'q':'r'):S.layout)+(S.markings==='eu'?'e':'u')+({none:'n',num:'1',let:'a'}[S.labels]);
  for(const a of ['s','w','n','e']){ const c=S.ctl[a]; h+= c.t==='light' ? (c.c==='y'?'a':c.c) : CTL_CODE[c.t]; }
  const parts=[h];
  const anyX=['s','w','n','e'].some(a=>S.ctl[a].panel||(S.ctl[a].x||[]).length);
  if(S.prio||anyX){
    let x='x'+(S.prio||'00');
    for(const a of ['s','w','n','e']){ const c=S.ctl[a]; let m=0; (c.x||[]).forEach(k=>{ m|=1<<EXTRAS.indexOf(k); }); x+=(c.panel?'1':'0')+m.toString(16).padStart(4,'0'); }
    parts.push(x);
  }
  for(const it of S.items){
    const ci=Math.max(0,COLORS.indexOf(it.color));
    const pedCol=['#7e57c2','#e5552e','#16a085','#f39c12'].indexOf(it.color);
    parts.push(KINDS[it.kind].code+it.arm+(isCw(it)?(it.end>0?'p':'m'):it.arm==='o'?String(it.lane):(it.side==='in'?'i':'o'))+String((isCw(it)?(it.pos||0):it.arm==='o'?it.ang:it.dist)||0).padStart(3,'0')
      +({left:'l',straight:'s',right:'r',uturn:'u',cross:'c',wait:'w'}[it.man])
      +(isCw(it) && pedCol>=0 ? String.fromCharCode(97+pedCol) : String(ci))
      +({auto:'a',none:'n',left:'l',right:'r',hazards:'h'}[it.signal])+(it.arrow?'1':'0')+(it.lights?'1':'0'));
  }
  return parts.join('-');
}
function decode(str){
  const parts=str.split('-'), h=parts[0];
  if(!h || h[0]!=='d' || h.length<8) return null;
  const st=freshState();
  st.layout=h[1]==='t'?'t':(h[1]==='r'||h[1]==='q')?'r':'4'; st.rlanes=h[1]==='q'?3:2; st.markings=h[2]==='u'?'us':'eu'; st.labels={n:'none','1':'num',a:'let'}[h[3]]||'none';
  ['s','w','n','e'].forEach((a,i)=>{ const ch=h[4+i]; st.ctl[a]= 'rag'.includes(ch)?{t:'light',c:(ch==='a'?'y':ch),panel:false,x:[]}:{t:{'0':'none',s:'stop',y:'yield',p:'prio',q:'prioEnd'}[ch]||'none',c:'g',panel:false,x:[]}; });
  for(const p of parts.slice(1)){
    if(p[0]==='x' && p.length>=23){
      const pr=p.slice(1,3); st.prio = pr==='00'?null:pr;
      ['s','w','n','e'].forEach((a,i)=>{ const seg=p.slice(3+i*5,8+i*5); st.ctl[a].panel=seg[0]==='1'; const m=parseInt(seg.slice(1),16)||0; st.ctl[a].x=EXTRAS.filter((k,j)=>m&(1<<j)); });
      continue;
    }
    if(p.length<11) continue;
    const kind=KIND_BY_CODE[p[0]]; if(!kind) continue;
    const it={id:st.nid++,kind,arm:p[1],side:p[2]==='o'?'out':'in',end:p[2]==='m'?-1:1,dist:+p.slice(3,6),
      man:{l:'left',s:'straight',r:'right',u:'uturn',c:'cross',w:'wait'}[p[6]]||'straight',
      color: /[a-d]/.test(p[7]) ? ['#7e57c2','#e5552e','#16a085','#f39c12'][p.charCodeAt(7)-97] : COLORS[+p[7]]||COLORS[0],
      signal:{a:'auto',n:'none',l:'left',r:'right',h:'hazards'}[p[8]]||'auto',arrow:p[9]!=='0',lights:p[10]==='1'};
    if(p[2]==='p'||p[2]==='m'){ it.pos=Math.min(2,+p.slice(3,6)||0); if(kind==='bike') it.cw=true; }
    if(it.arm==='o'){ it.lane=+p[2]||0; it.ang=+p.slice(3,6)||0; it.side='r'; }
    else if(!ARM_DEG.hasOwnProperty(it.arm)) continue;
    st.items.push(it);
  }
  const keep=S; S=st; st.preset=detectPreset(); S=keep;
  return st;
}

function movePts(v){
  const pts=[], push=(x,y)=>pts.push(toWorld(v.arm,x,y)), L=20;
  const seg=(x1,y1,x2,y2,n)=>{ for(let i=0;i<=n;i++) push(x1+(x2-x1)*i/n, y1+(y2-y1)*i/n); };
  const quad=(x0,y0,cx,cy,x1,y1,n)=>{ for(let i=0;i<=n;i++){ const t=i/n,u=1-t; push(u*u*x0+2*u*t*cx+t*t*x1, u*u*y0+2*u*t*cy+t*t*y1); } };
  if(isCw(v)){ const py=52+OF(); seg(v.end*44,py,-v.end*44,py,30); return pts; }
  const m=v.man;
  if(m==='straight') seg(L,64,L,-64,42);
  else if(m==='right'){ seg(L,64,L,46,6); quad(L,46,L,L,46,L,12); seg(46,L,64,L,6); }
  else if(m==='left'){ seg(L,64,L,40,8); quad(L,40,L,-L,-40,-L,26); seg(-40,-L,-64,-L,8); }
  else { seg(L,64,L,30,10); for(let i=0;i<=20;i++){ const a=Math.PI*i/20; push(L*Math.cos(a),30-L*Math.sin(a)); } seg(-L,30,-L,64,10); }

}

  const s0=AANG[v.arm], [X,d]=ringExit(s0,EXN[v.man]||2); return {start:s0,total:d,exit:X,lane:ringLaneFor(v.man),enter:v.arm};

const ringPasses=(sp,ang)=>{ const d=((sp.start-ang)%360+360)%360; return d>2 && d<sp.total-2; };
function ringConflict(A,B){
  if(isCw(A) && isCw(B)) return false;
  if(isCw(A)||isCw(B)){ const P=isCw(A)?A:B, V=isCw(A)?B:A, sp=ringSpan(V); return sp.enter===P.arm || sp.exit===P.arm; }
  const a=ringSpan(A), b=ringSpan(B);
  if(a.enter && b.enter){ if(A.arm===B.arm) return false; return ringPasses(a,AANG[B.arm]) || ringPasses(b,AANG[A.arm]) || a.exit===b.exit; }
  if(a.enter && !b.enter) return ringPasses(b,AANG[A.arm]);
  if(!a.enter && b.enter) return ringPasses(a,AANG[B.arm]);
  if(A.lane===B.lane){ const d1=((A.ang-B.ang)%360+360)%360, d2=((B.ang-A.ang)%360+360)%360; return (d1>0&&d1<100)||(d2>0&&d2<100); }
  const inn=A.lane>B.lane?A:B, out=inn===A?B:A, si=ringSpan(inn), so=ringSpan(out);
  return ringPasses(so,AANG[si.exit]) || so.exit===si.exit;
}
function ringYield(A,B){
  if(isEm(B) && !isEm(A)) return 'r_emerg';
  if(isEm(A) && !isEm(B)) return null;
  if(isCw(B)){ if(isCw(A)) return null; return pedGreen(B.arm)===null ? 'r_ped' : 'r_pedTurn'; }
  if(isCw(A)) return null;
  const a=ringSpan(A), b=ringSpan(B), signed=x=>['yield','stop'].includes(S.ctl[x].t);
  if(a.enter && !b.enter) return signed(A.arm) ? 'r_ringIn' : null;
  if(!a.enter && b.enter) return signed(B.arm) ? null : 'r_ringNoSign';
  if(a.enter && b.enter){
    const pa=ringPasses(a,AANG[B.arm]), pb=ringPasses(b,AANG[A.arm]);
    if(pa && !pb) return relDeg(A,B)===270 ? 'r_right' : 'r_ringAhead';
    if(pb && !pa) return null;
    return relDeg(A,B)===270 ? 'r_right' : null;
  }
  if(A.lane===B.lane){ const d=((A.ang-B.ang)%360+360)%360; return (d>0&&d<100) ? 'r_queue' : null; }
  return A.lane>B.lane ? 'r_ringLane' : null;
}
function conflict(A,B){
  if(isRing()) return ringConflict(A,B);
  if(isCw(A) && isCw(B)) return false;
  if(!isCw(A) && !isCw(B)){
    if(A.arm===B.arm) return false;
    if(A.man==='left' && B.man==='left' && relDeg(A,B)===180) return false;
    if(targetArm(A.arm,A.man)===targetArm(B.arm,B.man)) return true;
  }
  const pa=movePts(A), pb=movePts(B);
  for(const p of pa) for(const q of pb) if(Math.abs(p.x-q.x)<9 && Math.abs(p.y-q.y)<9 && Math.hypot(p.x-q.x,p.y-q.y)<9) return true;
  return false;
}
function virt(v,pr){
  const P1=v.arm, P2=pr.replace(P1,''), T=targetArm(v.arm,v.man);
  if(T===P2) return 'straight';
  const off=(ARM_DEG[T]-ARM_DEG[P1]+360)%360, offM=(ARM_DEG[P2]-ARM_DEG[P1]+360)%360;
  if(off===0) return 'uturn';
  return off<offM ? 'left' : 'right';
}
function mustYield(A,B,ctx){
  if(isRing()) return ringYield(A,B);
  if(isEm(B) && !isEm(A)) return 'r_emerg';
  if(isEm(A) && !isEm(B)) return null;
  if(isCw(B)){ if(isCw(A)) return null; return pedGreen(B.arm)===null ? 'r_ped' : 'r_pedTurn'; }
  if(isCw(A)) return null;
  const sig = armLight(A.arm) && armLight(B.arm);
  if(!sig && ctx.hasLevels){
    const da=ctx.lv[A.arm], db=ctx.lv[B.arm];
    if(da<db) return 'r_level';
    if(da>db) return null;
    if(S.prio && da===1 && !isStraightPair(S.prio)){
      const va=virt(A,S.prio), vb=virt(B,S.prio);
      if(va==='uturn' && vb!=='uturn') return 'r_uturn';
      if(va==='left' && (vb==='straight'||vb==='right')) return 'r_virt';
      return null;
    }
  }
  if(A.man==='uturn' && B.man!=='uturn') return 'r_uturn';
  if(B.man==='uturn' && A.man!=='uturn') return null;
  const rel=relDeg(A,B);
  if(rel===180) return (A.man==='left' && (B.man==='straight'||B.man==='right')) ? 'r_left' : null;
  if(rel===270) return 'r_right';
  return null;
}
const FORBID={left:['ii26','ii43s','ii43r','ii43sr'],right:['ii261','ii43s','ii43l','ii43sl'],straight:['ii43l','ii43r'],uturn:['ii27','ii43s','ii43l','ii43r','ii43sr','ii43sl']};
function solve(){
  const all=S.items.filter(onBoard);
  const lab={}; all.forEach((it,i)=>lab[it.id]=labelText(i,'let'));
  const ctx=levelInfo();
  const P=[], excluded=[];
  for(const it of all){
    if(isCw(it)){ if(it.man==='cross') P.push(it); else excluded.push([it,'n_pedWait']); }
    else if(it.arm==='o' || (it.side==='in' && maneuverOK(it.arm,it.man))) P.push(it); else excluded.push([it,'n_out']);
  }
  const act=P.filter(inPhase), waiting=P.filter(v=>!inPhase(v));
  const pred={}; act.forEach(v=>pred[v.id]=[]);
  for(const A of act) for(const B of act){
    if(A===B || !conflict(A,B)) continue;
    const r=mustYield(A,B,ctx); if(r) pred[A.id].push({b:B,r});
  }
  // queues in the same lane
  for(const arm of arms()){
    const q=act.filter(v=>!isCw(v) && v.arm===arm).sort((a,b)=>a.dist-b.dist);
    for(let i=1;i<q.length;i++) pred[q[i].id].push({b:q[i-1],r:'r_queue'});
  }
  const done=new Set(), steps=[], dead={};
  let rest=act.slice();
  while(rest.length){
    let wave=rest.filter(v=>pred[v.id].every(p=>done.has(p.b.id)||p.ignored));
    if(!wave.length){
      const pick=rest.slice().sort((a,b)=>pred[a.id].filter(p=>!done.has(p.b.id)).length-pred[b.id].filter(p=>!done.has(p.b.id)).length || all.indexOf(a)-all.indexOf(b))[0];
      pred[pick.id].forEach(p=>{ if(!done.has(p.b.id) && p.r!=='r_queue') p.ignored=true; });
      if(pred[pick.id].some(p=>!done.has(p.b.id)&&!p.ignored)){ pred[pick.id].forEach(p=>{ if(!done.has(p.b.id)) p.ignored=true; }); }
      dead[pick.id]=true; wave=[pick];
    }
    steps.push(wave); wave.forEach(v=>done.add(v.id)); rest=rest.filter(v=>!done.has(v.id));
  }
  const stepOf={}; steps.forEach((w,i)=>w.forEach(v=>stepOf[v.id]=i+1)); waiting.forEach(v=>stepOf[v.id]='w');
  let reg = isRing() ? (arms().some(a=>['yield','stop'].includes(S.ctl[a].t)) ? 'reg_ring' : 'reg_ringNone') : arms().some(armLight) ? 'reg_light' : ctx.hasLevels ? 'reg_signs' : ctx.allMinor ? 'reg_all' : 'reg_none';
  return {steps,waiting,excluded,pred,lab,ctx,stepOf,reg,dead,count:P.length};
}
function who(v,lab){
  const k=t(v.kind);
  if(isCw(v)) return `${lab[v.id]} – ${k}, ${t('appr_'+v.arm)}, ${t('crossing').toLowerCase()}`;
  if(v.arm==='o'){ const ln = v.lane===0 ? t('lane0') : (v.lane===ringGeo().lanes-1 ? t('lane2') : t('lane1')); return `${lab[v.id]} – ${k}, ${t('inRing')} (${ln}), ${t('ex'+EXN[v.man])}`; }
  if(isRing()) return `${lab[v.id]} – ${k}, ${t('appr_'+v.arm)}, ${t('ex'+EXN[v.man])}`;
  return `${lab[v.id]} – ${k}, ${t('appr_'+v.arm)}, ${t(v.man).toLowerCase()}`;
}
function notesFor(v,R,active){
  const out=[];
  if(v.kind==='bike' && v.cw) out.push(t('n_bikeCw'));
  if(EMERGENCY.has(v.kind) && !v.lights && !isCw(v)) out.push(t('n_noLights'));
  if(v.arm==='o') return out;
  if(!isCw(v) && S.ctl[v.arm].t==='stop') out.push(t('n_stopS'));
  if(!isCw(v) && !isRing()){ const f=(FORBID[v.man]||[]).find(x=>(S.ctl[v.arm].x||[]).includes(x)); if(f) out.push(`<span class="warn">${t('n_forb').replace('{s}',t('n_'+f))}</span>`); }
  return out;
}
function renderSolution(){
  const body=document.getElementById('solBody');
  const R=sol; if(!R) return;
  if(!R.count){ body.innerHTML=`<p>${t('noUsers')}</p>`; return; }
  const esc=x=>x;
  let h=`<div class="reg">${t(R.reg)}</div>`;
  R.steps.forEach((w,i)=>{
    h+=`<div class="step"><div class="num">${i+1}</div><div style="flex:1">`;
    if(w.length>1) h+=`<div class="tog">${w.map(v=>R.lab[v.id]).join(' + ')} – ${t('together')}</div>`;
    for(const v of w){
      const pr=R.pred[v.id].filter(p=>!p.ignored);
      const li=[];
      if(R.dead[v.id]) li.push(t('n_deadlock').replace('{a}',R.lab[v.id]));
      if(pr.length){ li.push(`<b>${t('yieldsTo')}</b>`); pr.forEach(p=>{ const x=t(p.r).replace('{b}',R.lab[p.b.id]); li.push(x.charAt(0).toUpperCase()+x.slice(1)); }); }
      else if(!R.dead[v.id]){
        li.push(t('free'));
        if(isEm(v)) li.push(t('p_emerg'));
        else if(isCw(v)) li.push(t('p_ped'));
        else if(armLight(v.arm)==='g') li.push(t('p_green'));
        else if(v.arm==='o') li.push(t('p_ring'));
        else if(!isRing() && R.ctx.hasLevels && R.ctx.lv[v.arm]===1) li.push(t('p_main'));
      }
      notesFor(v).forEach(n=>li.push(n));
      h+=`<div class="ent"><div class="who">${who(v,R.lab)}</div><ul>${li.map(x=>`<li>${x}</li>`).join('')}</ul></div>`;
    }
    h+=`</div></div>`;
  });
  if(R.waiting.length){
    h+=`<h5>${t('waitGreen')}</h5>`;
    R.waiting.forEach(v=>{ const l=armLight(v.arm); const n= isCw(v)?t('n_pedRed'): l==='y'?t('n_amber'):t('n_red');
      h+=`<div class="ent"><div class="who">${who(v,R.lab)}</div><ul><li>${n}</li></ul></div>`; });
  }
  if(R.excluded.length){
    h+=`<h5>${t('notIncl')}</h5><div class="ent"><ul>${R.excluded.map(([v,k])=>`<li>${R.lab[v.id]} – ${t(v.kind)}: ${t(k)}</li>`).join('')}</ul></div>`;
  }
  h+=`<div class="disc">${t('disc')}</div>`;
  body.innerHTML=h;
}
function propClick(id){
  const i=prop.steps.findIndex(w=>w.includes(id));
  if(i>=0){ prop.steps[i]=prop.steps[i].filter(x=>x!==id); if(!prop.steps[i].length) prop.steps.splice(i,1); }
  else if(prop.same && prop.steps.length){ prop.steps[prop.steps.length-1].push(id); prop.same=false; }
  else { prop.steps.push([id]); prop.same=false; }
  prop.res=null; render();
}
function checkProp(){
  const R=solve(), us={}; prop.steps.forEach((w,i)=>w.forEach(id=>us[id]=i+1));
  const errs=[], status={}, L=id=>R.lab[id];
  const byId={}; S.items.forEach(it=>byId[it.id]=it);
  Object.keys(us).forEach(id=>status[id]='good');
  for(const v of R.waiting) if(us[v.id]){ const l=armLight(v.arm); errs.push(t('e_wait').replace('{a}',L(v.id)).replace('{r}', isCw(v)?t('n_pedRed'): l==='y'?t('n_amber'):t('n_red'))); status[v.id]='bad'; }
  for(const [v,k] of R.excluded) if(us[v.id]){ errs.push(t('e_excl').replace('{a}',L(v.id)).replace('{r}',t(k))); status[v.id]='bad'; }
  const active=R.steps.flat();
  for(const v of active) if(!us[v.id]) errs.push(t('e_missing').replace('{a}',L(v.id)));
  for(const A of active) for(const p of R.pred[A.id]){
    if(p.ignored || !us[A.id] || !us[p.b.id]) continue;
    if(us[A.id]<=us[p.b.id]){ const r=t(p.r).replace('{b}',L(p.b.id)); errs.push(t('e_order').replace('{a}',L(A.id)).replace(/\{b\}/g,L(p.b.id)).replace('{r}',r)); status[A.id]='bad'; }
  }
  const groups=R.steps.filter(w=>w.length>1).map(w=>w.map(v=>L(v.id)).join(' + '));
  const alt = !errs.length && prop.steps.length>R.steps.length && groups.length ? t('okAlt').replace('{g}',groups.join(', ')) : '';
  prop.res={errs,status,alt,dead:Object.keys(R.dead).length>0}; prop.sig=encode();
  render();
}
function renderProp(){
  const body=document.getElementById('propBody'); if(!body) return;
  const all=S.items.filter(onBoard); const lab={}; all.forEach((it,i)=>lab[it.id]=labelText(i,'let'));
  prop.steps=prop.steps.map(w=>w.filter(id=>lab[id])).filter(w=>w.length);
  let h=`<div class="reg">${t('propHelp')}</div>`;
  if(!all.length){ body.innerHTML=h+`<p>${t('noUsers')}</p>`; return; }
  h+=`<label class="same"><input type="checkbox" id="propSame" ${prop.same?'checked':''}> ${t('sameStep')}</label>`;
  if(!prop.steps.length) h+=`<p style="color:var(--muted)">${t('emptyProp')}</p>`;
  else h+=`<div class="chips">${prop.steps.map((w,i)=>`<div class="chiprow"><div class="num o">${i+1}</div>${w.map(id=>`<span class="chip" data-rm="${id}">${lab[id]} ✕</span>`).join('<span>+</span>')}</div>`).join('')}</div>`;
  h+=`<div class="acts"><button class="btn on" id="propCheck" ${prop.steps.length?'':'disabled'}>${t('check')}</button><button class="btn" id="propClear">${t('clearProp')}</button></div>`;
  if(prop.res){
    if(prop.sig!==encode()) h+=`<div class="res badr">${t('changed')}</div>`;
    else if(!prop.res.errs.length) h+=`<div class="res good"><b>${t('pOk')}</b>${prop.res.alt?`<div style="margin-top:4px">${prop.res.alt}</div>`:''}</div>`;
    else h+=`<div class="res badr"><b>${t('bad').replace('{n}',prop.res.errs.length)}</b><ul>${prop.res.errs.map(e=>`<li>${e}</li>`).join('')}</ul></div>`;
    if(prop.res.dead) h+=`<p style="font-size:12px;color:var(--muted)">${t('deadNote')}</p>`;
    h+=`<div class="acts"><button class="btn" id="propShowSol">${t('showSol')}</button></div>`;
  }
  body.innerHTML=h;
  document.getElementById('propSame').onchange=e=>{ prop.same=e.target.checked; };
  body.querySelectorAll('[data-rm]').forEach(el=>el.onclick=()=>propClick(+el.dataset.rm));
  document.getElementById('propCheck').onclick=checkProp;
  document.getElementById('propClear').onclick=()=>{ prop.steps=[]; prop.res=null; prop.same=false; render(); };
  const sb=document.getElementById('propShowSol'); if(sb) sb.onclick=()=>setSol(true);
}
function setProp(open){

function setSol(open){

  if(e.target.matches('input,select,textarea')) return;
  const mod=e.ctrlKey||e.metaKey;
  if(mod && e.key.toLowerCase()==='z' && !e.shiftKey){ e.preventDefault(); undo(); }
